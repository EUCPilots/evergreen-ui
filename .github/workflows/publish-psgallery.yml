name: 'Publish to PowerShell Gallery'

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Existing release tag to publish'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example, v1.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      checkout_ref: ${{ inputs.tag || github.ref }}

  publish:
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $manifest = Import-PowerShellDataFile -Path '.\EvergreenUI\EvergreenUI.psd1'
          $expectedTag = "v$($manifest.ModuleVersion)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
              throw "Release tag '$env:RELEASE_TAG' does not match manifest version '$expectedTag'."
          }

      - name: Install required modules
        shell: pwsh
        run: |
          Install-Module -Name Evergreen -Force -Scope CurrentUser

      - name: Publish module to PowerShell Gallery
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-Module -Path ".\EvergreenUI" -NuGetApiKey $env:NUGET_API_KEY -Verbose
