name: 'Pester tests'

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell 7.6
        shell: pwsh
        run: |
          $archive = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'PowerShell-7.6.0-win-x64.zip'
          $installPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'PowerShell-7.6.0'
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.0/PowerShell-7.6.0-win-x64.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $installPath
          $installPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install test dependencies
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') {
            throw 'PowerShell 7.6 or later is required.'
          }
          Install-Module -Name Microsoft.Graph.Authentication -Scope CurrentUser -Force
          Install-Module -Name Pester -RequiredVersion '5.7.1' -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name Evergreen -MinimumVersion '2603.2832.0' -Scope CurrentUser -Force

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module -Name Pester -RequiredVersion '5.7.1' -Force
          $config = New-PesterConfiguration
          $config.Run.Path = '.\tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'pester-results.xml'
          $result = Invoke-Pester -Configuration $config
          @(
            '## Pester test results'
            ''
            "| Result | Count |"
            "| --- | ---: |"
            "| Passed | $($result.PassedCount) |"
            "| Failed | $($result.FailedCount) |"
            "| Skipped | $($result.SkippedCount) |"
            "| Inconclusive | $($result.InconclusiveCount) |"
            "| Not run | $($result.NotRunCount) |"
            "| Total | $($result.TotalCount) |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($result.Result -ne 'Passed' -or $result.TotalCount -eq 0) {
            throw 'Pester tests failed or no tests were discovered.'
          }

      - name: Upload Pester test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: ${{ runner.temp }}\pester-results.xml
          if-no-files-found: warn
